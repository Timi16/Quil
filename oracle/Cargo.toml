[package]
name = "quill-oracle"
description = "The program Quill runs inside OutLayer's TEE: fetch public compute prices, reduce them to index values, print the result."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "quill-oracle"
path = "src/main.rs"

[dependencies]
quill-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Plain HTTPS for running the same program on a laptop.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "2"

# OutLayer's enclave: HTTP through the WASI Preview 2 host interface.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi-http-client = "0.2"
