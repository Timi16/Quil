<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quill the hedgehog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<span style="{{box}}">
  <sc-if value="{{isStand}}" hint-placeholder-val="{{true}}">
    <svg viewBox="0 0 170 112" width="100%" height="100%" role="img" aria-label="Quill the hedgehog" style="display: block; overflow: visible">
      <ellipse cx="46" cy="102" rx="9" ry="5" fill="#FBE7CF" stroke="#17130F" stroke-width="2.5"></ellipse>
      <ellipse cx="74" cy="102" rx="9" ry="5" fill="#FBE7CF" stroke="#17130F" stroke-width="2.5"></ellipse>
      <path d="M26 98 L14 86 L27 83 L14 69 L29 68 L20 52 L36 55 L31 38 L47 44 L46 27 L60 37 L65 20 L76 34 L86 19 L93 35 L106 24 L109 41 L122 35 L121 51 L132 50 L128 64 L120 98 Z" fill="#3B2A1D" stroke="#17130F" stroke-width="3" stroke-linejoin="round"></path>
      <path d="M40 72l5-9 5 9M62 60l5-9 5 9M84 58l5-9 5 9M56 84l5-9 5 9M80 82l5-9 5 9M100 70l4-8 4 8" fill="none" stroke="#FFC93C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M104 98 C100 80 108 62 124 60 C136 58 148 68 158 82 C161 86 162 90 158 92 C150 96 136 98 104 98 Z" fill="#FBE7CF" stroke="#17130F" stroke-width="3" stroke-linejoin="round"></path>
      <circle cx="115" cy="62" r="6.5" fill="#F3B79B" stroke="#17130F" stroke-width="2.5"></circle>
      <ellipse cx="143" cy="85" rx="5" ry="3" fill="#F7A98B"></ellipse>
      <g style="transform-box: fill-box; transform-origin: center; animation: qBlink 5s ease-in-out infinite">
        <circle cx="134" cy="74" r="3.6" fill="#17130F"></circle>
        <circle cx="135.3" cy="72.7" r="1.1" fill="#FFFFFF"></circle>
      </g>
      <circle cx="159" cy="87" r="4.2" fill="#17130F"></circle>
      <ellipse cx="114" cy="102" rx="9" ry="5" fill="#FBE7CF" stroke="#17130F" stroke-width="2.5"></ellipse>
      <ellipse cx="138" cy="102" rx="9" ry="5" fill="#FBE7CF" stroke="#17130F" stroke-width="2.5"></ellipse>
    </svg>
  </sc-if>
  <sc-if value="{{isBall}}" hint-placeholder-val="{{false}}">
    <svg viewBox="0 0 120 120" width="100%" height="100%" role="img" aria-label="Quill the hedgehog curled into a ball" style="display: block; overflow: visible">
      <polygon points="{{ballPts}}" fill="#3B2A1D" stroke="#17130F" stroke-width="3" stroke-linejoin="round"></polygon>
      <path d="M38 52l5-9 5 9M58 42l5-9 5 9M44 74l5-9 5 9M64 64l5-9 5 9M56 88l5-9 5 9" fill="none" stroke="#FFC93C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M86 62 C100 58 112 68 113 77 C104 84 92 82 84 76 Z" fill="#FBE7CF" stroke="#17130F" stroke-width="3" stroke-linejoin="round"></path>
      <path d="M93 70q3-3 6 0" fill="none" stroke="#17130F" stroke-width="2.2" stroke-linecap="round"></path>
      <circle cx="111" cy="76" r="3.4" fill="#17130F"></circle>
    </svg>
  </sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pose":{"editor":"enum","options":["stand","ball"],"default":"stand"},"size":{"editor":"int","default":170,"min":40,"max":400},"$preview":{"width":170,"height":112}}'>
class Component extends DCLogic {
  renderVals() {
    const pose = this.props.pose ?? 'stand';
    const s = Number(this.props.size ?? 170) || 170;
    const h = pose === 'ball' ? s : Math.round(s * 112 / 170);
    const pts = [];
    const n = 16;
    for (let i = 0; i < n * 2; i++) {
      const r = i % 2 === 0 ? 54 : 40;
      const a = (Math.PI * 2 * i) / (n * 2) - Math.PI / 2;
      pts.push((60 + r * Math.cos(a)).toFixed(1) + ',' + (60 + r * Math.sin(a)).toFixed(1));
    }
    return {
      box: 'display: inline-block; width: ' + s + 'px; height: ' + h + 'px; line-height: 0; flex-shrink: 0',
      isStand: pose !== 'ball',
      isBall: pose === 'ball',
      ballPts: pts.join(' ')
    };
  }
}
</script>
</body>
</html>
