[package]
name = "quill-sandbox"
description = "The whole market lifecycle on a local NEAR node: the real contract builds, real receipts, the clock fast-forwarded through a day of hourly fixings."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
near-workspaces = "0.24"
near-sandbox = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
