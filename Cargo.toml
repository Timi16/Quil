[workspace]
resolver = "2"
members = [
    "crates/quill-core",
    "contracts/claim-market",
    "contracts/fixing-oracle",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/[YOUR-ORG]/quill"

[workspace.dependencies]
quill-core = { path = "crates/quill-core" }
near-sdk = "5"

# Contracts are money-holding code: keep overflow checks on in release builds.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
